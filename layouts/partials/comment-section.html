{{- $provider := default "twikoo" site.Params.comment.provider -}}
<section id="page-comment-section" class="sakura-comment sakura-page-comment" data-comment-provider="{{ $provider }}">
  {{- if eq $provider "utterances" -}}
  {{- $u := site.Params.utterances | default dict -}}
  <div
    id="utterances"
    class="sakura-utterances sakura-comment-root"
    data-repo="{{ $u.repo }}"
    data-issue-term="{{ $u.issueTerm | default `pathname` }}"
    data-label="{{ $u.label | default `comment` }}"
  ></div>
  <style>
    .sakura-utterances { min-height: 120px; margin-top: 12px; }
    .sakura-utterances .utterances { max-width: 100%; }
  </style>
  {{- else if eq $provider "waline" -}}
  <div
    id="waline"
    class="sakura-waline sakura-comment-root"
    data-placeholder="{{ site.Params.waline.placeholder | default `分享你的想法...` }}"
  ></div>
  {{- else -}}
  <div class="sakura-twikoo">
    <div id="tcomment" class="sakura-comment-root"></div>
  </div>
  {{- end -}}
</section>
